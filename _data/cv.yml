- title: Working Papers
  type: time_table
  contents:
    - title: "Causal Machine Learning Reveals Divergent Effectiveness of Governance Modes for Sustainable Agricultural Transformation"
      institution: Preprint
      year: 2026
      description:
        - "Authors: TANG Juk-Sen (Lead), ZHANG Haobo, SHAN Lily, CHEN Junhong"
        - Applied Causal Forest with DML to three policy reforms across 2,700+ Chinese counties; showed that governance design, not fiscal magnitude, determines effectiveness
    - title: "Scaling Laws, Poverty Traps, and the Urbanization Crossover in Chinese County Economies"
      institution: Preprint
      year: 2026
      description:
        - "Author: TANG Juk-Sen (Sole Author)"
        - Estimated sector-specific urban scaling exponents for approximately 2,800 Chinese counties (2000–2023); identified an urbanization crossover threshold and persistent scaling deficits in 832 designated poverty counties
    - title: "Are Food Safety Classifiers Learning Hazards or Memorizing Firms? Entity-Level Leakage in FDA Recall Severity Prediction"
      institution: Preprint
      year: 2026
      description:
        - "Authors: LI Peilun, TANG Juk-Sen (Corresponding Author)"
        - Benchmarked ML classifiers on 28,448 FDA recall records; exposed that 92% of apparent performance stems from firm-level memorization and proposed group-aware evaluation protocols
    - title: "Carbon Price Certainty and Green Innovation: Evidence from Canada's Federal Backstop Policy"
      institution: Preprint
      year: 2025
      description:
        - "Author: TANG Juk-Sen (Sole Author)"
        - Exploited Alberta's 2019 backstop adoption as a natural experiment across 1,381 firms; found that legislative clarification, not announcement, drives green patenting

