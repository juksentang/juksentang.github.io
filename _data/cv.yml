    - title: Agricultural Productivity and Its Spatial Spillover Effects in China
      institution: "Agriculture, 2026, 16(5), 543"
      year: 2026
      description:
        - "Authors: TANG Juk-Sen (Lead), LU Hongwei, GONG Tianyi, CHEN Junhong"
